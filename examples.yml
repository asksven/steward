# Example control repo structure
#
# homelab-gitops/
#   nodes/
#     node1.lan/
#       arr.yml
#       prometheus.yml
#     node2.lan/
#       arr.yml
#   templates/
#     arr.yml
#     prometheus.yml

---
# templates/arr.yml
# Copy this to nodes/<hostname>/arr.yml and customize
version: 2
name: arr
repo: git@github.com:you/arr-stack.git
ref:
  branch: main
path: .
compose_file: docker-compose.yml
compose_env_file: ~
sync_policy: auto
pull_policy: always
enabled: true

---
# templates/prometheus-node-exporter.yml
version: 2
name: prometheus-node-exporter
repo: git@github.com:you/prometheus-stack.git
ref:
  branch: main
path: .
compose_file: docker-compose.yml
compose_env_file: ~
sync_policy: auto
pull_policy: always
enabled: true

---
# nodes/node1.lan/arr.yml
version: 2
name: arr
repo: git@github.com:you/arr-stack.git
ref:
  branch: main
path: .
compose_file: docker-compose.yml
compose_env_file: /opt/gitops/arr.env
sync_policy: auto
pull_policy: always
enabled: true

---
# nodes/node1.lan/prometheus-node-exporter.yml
version: 2
name: prometheus-node-exporter
repo: git@github.com:you/prometheus-stack.git
ref:
  tag: v1.8.0          # pinned to a release tag on this node
path: .
compose_file: docker-compose.yml
compose_env_file: ~
sync_policy: auto
pull_policy: missing
enabled: true
