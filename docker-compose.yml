services:
  steward:
    # Version is pinned here and updated by Dependabot PRs.
    # Override with AGENT_IMAGE in .env for local testing (e.g. AGENT_IMAGE=ghcr.io/asksven/steward:v0.4.1
    image: ${AGENT_IMAGE:-ghcr.io/asksven/steward:v0.4.1}
    container_name: steward
    restart: unless-stopped
    environment:
      # Required — set in .env
      CONTROL_REPO_URL: ${CONTROL_REPO_URL}
      CONTROL_REPO_BRANCH: ${CONTROL_REPO_BRANCH:-main}

      # Node identity — defaults to container hostname if not set
      GITOPS_NODE_NAME: ${GITOPS_NODE_NAME:-}

      # Local repo root inside the container — maps to STEWARD_DATA_DIR on the host
      GITOPS_ROOT: ${GITOPS_ROOT:-/git}

      # Container name — used for debug path logging and self-update helper (docker inspect)
      AGENT_CONTAINER_NAME: ${AGENT_CONTAINER_NAME:-steward}

      # File ownership — set to host UID/GID so files in STEWARD_DATA_DIR are not owned by root
      STEWARD_UID: ${STEWARD_UID:-0}
      STEWARD_GID: ${STEWARD_GID:-0}

      # Logging — set to DEBUG for verbose path diagnostics
      LOGLEVEL: ${LOGLEVEL:-INFO}

      # Metrics — set METRICS_PORT to expose a Prometheus /metrics scrape endpoint (default: disabled)
      METRICS_PORT: ${METRICS_PORT:-}

    # Expose the metrics port via docker-compose.override.yml, e.g.:
    #   ports:
    #     - "9101:9101"

    volumes:
      # Docker socket — needed to run compose commands
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent git repos — bind-mounted so the host path is predictable
      # Set STEWARD_DATA_DIR in .env to control the outside path
      - ${STEWARD_DATA_DIR:-./steward-data}:/git

    # SSH credentials are configured via credentials.yml (recommended) or Docker secrets.
    # See README §5 "Set up SSH authentication" for setup instructions.
    # For single-key Docker secrets, add to docker-compose.override.yml:
    #   secrets:
    #     - ssh_key
    #     - ssh_known_hosts   # optional
    # and define a top-level secrets block pointing to your key files.
