services:
  steward:
    image: ${AGENT_IMAGE:-ghcr.io/asksven/steward:latest}
    container_name: steward
    restart: unless-stopped
    environment:
      # Required — set in .env
      CONTROL_REPO_URL: ${CONTROL_REPO_URL}
      CONTROL_REPO_BRANCH: ${CONTROL_REPO_BRANCH:-main}

      # Node identity — defaults to container hostname if not set
      GITOPS_NODE_NAME: ${GITOPS_NODE_NAME:-}

      # Local repo root inside the container — maps to STEWARD_DATA_DIR on the host
      GITOPS_ROOT: ${GITOPS_ROOT:-/git}

      # Self-update — agent will restart itself when a new image is pushed
      AGENT_CONTAINER_NAME: ${AGENT_CONTAINER_NAME:-steward}
      AGENT_IMAGE: ${AGENT_IMAGE}

      # Logging — set to DEBUG for verbose path diagnostics
      LOGLEVEL: ${LOGLEVEL:-INFO}

    volumes:
      # Docker socket — needed to run compose commands
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent git repos — bind-mounted so the host path is predictable
      # Set STEWARD_DATA_DIR in .env to control the outside path
      - ${STEWARD_DATA_DIR:-./steward-data}:/git
